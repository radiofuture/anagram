version: 2
updates:
  # Python dependencies (uv.lock).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Actions pinned by SHA in the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # Google's reference verifiers for the differential tests.
  - package-ecosystem: gomod
    directory: /tests/differential/refverify
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

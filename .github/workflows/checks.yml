name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e:
        description: "Also run the Docker end-to-end test"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
env:
  UV_VERSION: "0.7.20"
  HF_HUB_OFFLINE: "1"
# Third-party actions are pinned by commit SHA; the comment gives the tag.
# Dependabot (.github/dependabot.yml) proposes updates.
jobs:
  check:
    name: Lint, tests, coverage, audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync playwright install --with-deps chromium
      # The coverage floor is fail_under in pyproject.toml.
      - run: uv run --no-sync pytest -q -p no:randomly --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: anagram-coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
      # Audit the locked set (all extras and the dev group), not the venv.
      - run: uv export --frozen --all-extras --no-hashes --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
      - run: uv run --no-sync pip-audit --strict --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"

  types:
    name: Type check (strict set)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - run: uv sync --locked --all-extras
      # The strict set and the plan to grow it are in [tool.mypy] in pyproject.toml.
      - run: uv run --no-sync mypy

  differential:
    # Plan scenario 3: the same evidence through Anagram's AMD and Intel
    # verifiers and through Google's go-sev-guest and go-tdx-guest
    # (tests/differential/refverify, pinned in its go.sum), offline.
    name: Differential tests (go-sev-guest, go-tdx-guest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tests/differential/refverify/go.mod
          cache-dependency-path: tests/differential/refverify/go.sum
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - run: go vet ./... && go build -o "$RUNNER_TEMP/refverify" .
        working-directory: tests/differential/refverify
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync pytest -q -p no:randomly --no-cov tests/test_enclave_differential.py
        env:
          ANAGRAM_REFVERIFY: ${{ runner.temp }}/refverify
          ANAGRAM_DIFFERENTIAL_N: "5000"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The gitleaks binary, not gitleaks-action: the action needs a paid
      # licence for organisation repositories. The checksum pins the binary.
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the repository
        run: |
          "$RUNNER_TEMP/gitleaks" dir . \
            --config .gitleaks.toml --redact --no-banner

  web:
    name: JS/CSS lint and format (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: "2.6.6"
      - run: biome ci .

  e2e:
    name: Docker end-to-end
    # Slow (builds the images): manual only. Run it from the Actions tab with
    # the "e2e" input set.
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - run: deploy/local-e2e.sh
